name: QuantumEngine CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup PowerShell
      uses: actions/setup-powershell@v3
      
    - name: Install Dependencies
      run: |
        Install-Module -Name Pester -Force -SkipPublisherCheck
        Install-Module -Name PSScriptAnalyzer -Force
        
    - name: Run Pester Tests
      run: |
        $testResults = Invoke-Pester -Path ./Tests -Output Detailed -PassThru
        if ($testResults.FailedCount -gt 0) { exit 1 }
        
    - name: Run Script Analyzer
      run: |
        Invoke-ScriptAnalyzer -Path ./Modules -Recurse
        
    - name: Upload Test Results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results
        path: testResults.xml

  build:
    runs-on: windows-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Create Release Package
      run: |
        $version = "2.0.0"
        $releaseName = "QuantumEngine-v$version"
        Compress-Archive -Path ./Modules, ./Scripts, ./Config, ./Docs -DestinationPath "$releaseName.zip"
        
    - name: Upload Release Artifact
      uses: actions/upload-artifact@v3
      with:
        name: release-package
        path: "*.zip"
